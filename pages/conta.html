<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar informações</title>
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/conta.css">
</head>
<body>
    <div class="conta">
        <form>
            <label>Nome Completo: </label><br>
            <input type="text" name="nome" placeholder="Cleber da Cunha"><br><br>

            <label class="aviso">Impossível alterar a data de nascimento!</label><br>
            <input type="date" name="data" readonly><br><br>

            <label class="aviso">Impossível alterar o CPF!</label><br>
            <input type="text" name="cpf" placeholder="526574489562" readonly><br><br>

            <label>Telefone: </label><br>
            <input type="tel" name="telefone" placeholder="(19) 99999-9999"><br><br>

            <label>E-mail: </label><br>
            <input type="email" name="email" placeholder="seu@email.com"><br><br>

            <label class="aviso">Impossível alterar o seu username!</label><br>
            <input type="text" name="username" placeholder="Clebão do Ping Pong" readonly><br><br>

            <label>Senha: </label><br>
            <input type="password" name="senha" placeholder="Informe sua senha"><br><br>

            <div class="containerBotao">
                <button class="botao">Editar</button>
            </div>

            <div class="containerBotao">
                <a href="home.html" class="botao">Voltar para a Home</a>
            </div>

        </form>

    </div>



</body>
</html>
