<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Editar informações</title>
    <link rel="stylesheet" href="../css/cadastro.css">
</head>
<body>
    <div class="cadastro">
        <form>
            <!-- Nome -->

            <label>Nome Completo: </label><br>
            <input type="text" id="nome" name="nome" placeholder="Cleber da Cunha"><br><br>

            <!-- Data -->
            <label class="aviso">Impossível alterar a data de nascimento!</label><br>
            <input type="date" id="data" name="data" readonly><br><br>

            <!-- CPF -->
            <label class="aviso">Impossível alterar o CPF!</label><br>
            <input type="text" id="cpf" name="cpf" placeholder="526574489562" readonly><br><br>

            <!-- Telefone -->
            <label>Telefone: </label><br>
            <input type="tel" id="telefone" name="telefone" placeholder="(19) 99999-9999"><br><br>

            <!-- E-mail -->
            <label>E-mail: </label><br>
            <input type="email" id="email" name="email" placeholder="seu@email.com"><br><br>

            <!-- Username -->
            <label class="aviso">Impossível alterar o seu username!</label><br>
            <input type="text" id="username" name="username" placeholder="Clebão do Ping Pong" readonly><br><br>

            <!-- Senha -->
            <label>Senha: </label><br>
            <input type="password" id="senha" name="senha" placeholder="Informe sua senha"><br><br>

            <div class="containerBotao">
                <button class="botao">Editar</button>
            </div>

            <div class="containerBotao">
                <a href="home.html" class="botao">Voltar para a Home</a>
            </div>

        </form>

    </div>



</body>
</html>
