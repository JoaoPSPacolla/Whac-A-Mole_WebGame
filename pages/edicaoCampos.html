<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar informações</title>
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/conta.css">
</head>
<body>
    <div class="conta">
        <form>
            <label>Nome Completo: </label><br>
            <input type="text" name="nome" placeholder="Cleber da Cunha"><br><br>

            <label class="aviso">Impossível alterar data de nascimento</label><br>
            <input type="date" name="data" readonly><br><br>

            <label class="aviso">Impossível alterar seu CPF!</label><br>
            <input type="text" name="cpf" placeholder="526574489562" readonly><br><br>

            <label>Telefone: </label><br>
            <input type="tel" name="telefone" placeholder="(19) 98115-0472"><br><br>

            <label>E-mail: </label><br>
            <input type="email" name="email" placeholder="v195444@dac.unicamp.br"><br><br>

            <label class="aviso">Impossível alterar seu username!</label><br>
            <input type="text" name="username" placeholder="Clebão do Ping Pong" readonly><br><br>

            <div class="containerBotao">
                <button class="botao">Salvar alterações</button>
            </div>

            <div class="containerBotao">
                <a href="conta.html" class="botao">Voltar</a>
            </div>

        </form>

    </div>



</body>
</html>
