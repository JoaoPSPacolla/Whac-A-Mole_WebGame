<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/cadastro.css">
</head>
<body>
    <div class="cadastro">
        <form>
            <label>Nome Completo: </label><br>
            <input type="text" name="nome" placeholder="Digite seu nome completo"><br><br>

            <label>Data de Nascimento: </label><br>
            <input type="date" name="data"><br><br>

            <label>CPF: </label><br>
            <input type="text" name="cpf" placeholder="Apenas números"><br><br>

            <label>Telefone: </label><br>
            <input type="tel" name="telefone" placeholder="(19) 99999-9999"><br><br>

            <label>E-mail: </label><br>
            <input type="email" name="email" placeholder="seu@email.com"><br><br>

            <label>Username: </label><br>
            <input type="text" name="username" placeholder="Informe seu username"><br><br>

            <label>Senha: </label><br>
            <input type="password" name="senha" placeholder="Informe sua senha"><br><br>

            <div class="containerBotao">
                <button class="botao">Cadastrar</button>
            </div>

            <div class="containerBotao">
                <a href="../index.html" class="botao">Voltar para login</a>
            </div>

        </form>

    </div>



</body>
</html>
