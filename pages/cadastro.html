<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="../css/variaveis.css">
    <link rel="stylesheet" href="../css/cadastro.css">
</head>
<body>
    <div class="cadastro" id="formCadastro">
        <form>
            <label>Nome Completo: </label><br>
            <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required><br><br>

            <label>Data de Nascimento: </label><br>
            <input type="date" id="dataNascimento" name="data" required><br><br>

            <label>CPF: </label><br>
            <input type="text" id="cpf" name="cpf" placeholder="Apenas números" required><br><br>

            <label>Telefone: </label><br>
            <input type="tel" id="telefone" name="telefone" placeholder="(19) 99999-9999" required><br><br>

            <label>E-mail: </label><br>
            <input type="email" id="email" name="email" placeholder="seu@email.com" required><br><br>

            <label>Username: </label><br>
            <input type="text" id="username" name="username" placeholder="Informe seu username" required><br><br>

            <label>Senha: </label><br>
            <input type="password" id="senha" name="senha" placeholder="Informe sua senha" required><br><br>

            <div class="containerBotao">
                <button class="botao">Cadastrar</button>
            </div>

            <div class="containerBotao">
                <a href="../index.html" class="botao">Voltar para login</a>
            </div>

        </form>

    </div>


    <script src="../js/validaCampos.js"></script>
</body>
</html>
