<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="../css/cadastro.css">
</head>
<body>
    <div class="cadastro">
        <form>
            <!-- Nome -->

            <label>Nome Completo: </label><br>
            <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo"><br><br>

            <!-- Data -->
            <label>Data de Nascimento: </label><br>
            <input type="date" id="data" name="data"><br><br>

            <!-- CPF -->
            <label>CPF: </label><br>
            <input type="text" id="cpf" name="cpf" placeholder="Apenas números"><br><br>

            <!-- Telefone -->
            <label>Telefone: </label><br>
            <input type="tel" id="telefone" name="telefone" placeholder="(19) 99999-9999"><br><br>

            <!-- E-mail -->
            <label>E-mail: </label><br>
            <input type="text" id="emial" name="email" placeholder="seu@email.com"><br><br>

            <!-- Username -->
            <label>Username: </label><br>
            <input type="text" id="username" name="username" placeholder="Informe seu username"><br><br>

            <!-- Senha -->
            <label>Senha: </label><br>
            <input type="password" id="senha" name="senha" placeholder="Informe sua senha"><br><br>

            <div class="containerBotao">
                <button class="botao">Cadastrar</button>
            </div>

        </form>

    </div>



</body>
</html>
