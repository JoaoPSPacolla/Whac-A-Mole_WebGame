<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="../css/variaveis.css">
    <link rel="stylesheet" href="../css/cadastro.css">
</head>
<body>
    <div class="cadastro" id="formCadastro">
        <!-- novalidate: as mensagens de erro são mostradas por js/cadastro.js, embaixo de cada campo -->
        <form id="formularioCadastro" method="POST" action="../php/cadastro.php" novalidate>

            <div class="erroGeral" id="erroGeral" role="alert" hidden></div>

            <div class="campo">
                <label for="nome">Nome Completo: </label>
                <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" maxlength="120" required>
                <small class="erroCampo" id="erro-nome"></small>
            </div>

            <div class="campo">
                <label for="dataNascimento">Data de Nascimento: </label>
                <input type="date" id="dataNascimento" name="data" required>
                <small class="erroCampo" id="erro-data"></small>
            </div>

            <div class="campo">
                <label for="cpf">CPF: </label>
                <input type="text" id="cpf" name="cpf" placeholder="Apenas números" required>
                <small class="erroCampo" id="erro-cpf"></small>
            </div>

            <div class="campo">
                <label for="telefone">Telefone: </label>
                <input type="tel" id="telefone" name="telefone" placeholder="(19) 99999-9999" maxlength="20" required>
                <small class="erroCampo" id="erro-telefone"></small>
            </div>

            <div class="campo">
                <label for="email">E-mail: </label>
                <input type="email" id="email" name="email" placeholder="seu@email.com" maxlength="120" required>
                <small class="erroCampo" id="erro-email"></small>
            </div>

            <div class="campo">
                <label for="username">Username: </label>
                <input type="text" id="username" name="username" placeholder="Informe seu username" maxlength="30" required>
                <small class="erroCampo" id="erro-username"></small>
            </div>

            <div class="campo">
                <label for="senha">Senha: </label>
                <input type="password" id="senha" name="senha" placeholder="Informe sua senha" required>
                <small class="erroCampo" id="erro-senha"></small>
            </div>

            <div class="campo">
                <label for="confirmarSenha">Confirmar Senha: </label>
                <input type="password" id="confirmarSenha" name="confirmar_senha" placeholder="Digite novamente a senha" required>
                <small class="erroCampo" id="erro-confirmar_senha"></small>
            </div>

            <div class="containerBotao">
                <button type="submit" class="botao">Cadastrar</button>
            </div>

            <div class="containerBotao">
                <a href="../index.php" class="botao">Voltar para login</a>
            </div>

        </form>
    </div>

    <script src="../js/cadastro.js"></script>
</body>
</html>
