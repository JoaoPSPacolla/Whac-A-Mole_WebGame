<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acerte a Toupeira - Jogo</title>
    <link rel="stylesheet" href="../css/variaveis.css">
    <link rel="stylesheet" href="../css/jogo.css">
    <script src="../js/modoExplosivo.js" defer></script> <!-- Sem esse defer o código não contabiliza os pontos de clique no javascritp do jogo. Não sei o porquê-->
</head>

<body>
    <main class="paginaJogo">
        <header class="topbar">
            <div class="marca">
                <span>Acerte a toupeira!</span>
            </div>

            <nav class="linksNavegacao">
                <a href="conta.html">Perfil</a>
                <a href="ranking.html">Ranking</a>
                <a href="historico.html">Histórico</a>
                <a href="../index.html">Sair</a>
            </nav>
        </header>

        <!--
        Para poder fazer a lógica do jogo , o que pensei foi trocar todas as imagens pelo hole aqui no HTML
        Aí, no javascript seria feito algo randomico para ficar trocando as imagens 
        -->
        <div class="conteudoJogo">
            <div class="containerJogo">
                <div class="gradeJogo">
                    <div class="buraco">
                        <img src="../assets/imgs/hole.png" alt="Buraco Vazio" class="imgElemento">
                    </div>
                    <div class="buraco">
                        <img src="../assets/imgs/hole.png" alt="Buraco Vazio" class="imgElemento">
                    </div>
                    <div class="buraco">
                        <img src="../assets/imgs/hole.png" alt="Buraco Vazio" class="imgElemento">
                    </div>
                    <div class="buraco">
                        <img src="../assets/imgs/hole.png" alt="Buraco Vazio" class="imgElemento">
                    </div>
                    <div class="buraco">
                        <img src="../assets/imgs/hole.png" alt="Buraco Vazio" class="imgElemento">
                    </div>
                    <div class="buraco">
                        <img src="../assets/imgs/hole.png" alt="Buraco Vazio" class="imgElemento">
                    </div>
                    <div class="buraco">
                        <img src="../assets/imgs/hole.png" alt="Buraco Vazio" class="imgElemento">
                    </div>
                    <div class="buraco">
                        <img src="../assets/imgs/hole.png" alt="Buraco Vazio" class="imgElemento">
                    </div>
                    <div class="buraco">
                        <img src="../assets/imgs/hole.png" alt="Buraco Vazio" class="imgElemento">
                    </div>
                </div>
            </div>

            <div class="painelStatus">
                <div class="cartaoStatus">
                    <span class="rotuloStatus">Tempo Restante</span>
                    <strong id="timer"></strong>
                </div>

                <div class="cartaoStatus">
                    <span class="rotuloStatus">Pontuação</span>
                    <strong id="pontuacao">0</strong>
                </div>

                <div class="cartaoStatus">
                    <span class="rotuloStatus">Quantidade toupeiras</span>
                    <strong id="quantidadeToupeiras">0</strong>
                </div>

                <div class="cartaoStatus">
                    <span class="rotuloStatus">Próxima Meta</span>
                    <strong id="proximo">100</strong>
                </div>

                <button type="button" class="btnIniciar" onclick="iniciar()">Iniciar jogo</button>
            </div>
        </div>
    </main>
</body>

</html>
